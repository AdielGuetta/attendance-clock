name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: .NET build + tests (SQL Server 2022)
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Ci_Only_Passw0rd!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci_Only_Passw0rd!' -C -Q 'SELECT 1' -b"
          --health-interval 5s --health-timeout 5s --health-retries 30 --health-start-period 20s
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # Integration tests create and drop their own AttendanceTest_xxx database.
      ATTENDANCE_TEST_SQL: "Server=localhost,1433;User ID=sa;Password=Ci_Only_Passw0rd!;Encrypt=True;TrustServerCertificate=True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build backend/Attendance.sln -c Release
      - run: dotnet test --solution backend/Attendance.sln -c Release --no-build --report-xunit-trx --results-directory TestResults
      - name: Init-db twice against SQL Server (idempotency)
        env:
          ConnectionStrings__Attendance: "Server=localhost,1433;Database=AttendanceCi;User ID=sa;Password=Ci_Only_Passw0rd!;Encrypt=True;TrustServerCertificate=True"
        run: |
          dotnet run --project backend/Attendance.Api -c Release --no-build -- --init-db
          dotnet run --project backend/Attendance.Api -c Release --no-build -- --init-db
      - name: Smoke test against the real external time API
        env:
          ConnectionStrings__Attendance: "Server=localhost,1433;Database=AttendanceCi;User ID=sa;Password=Ci_Only_Passw0rd!;Encrypt=True;TrustServerCertificate=True"
        run: |
          dotnet run --project backend/Attendance.Api -c Release --no-build -- --urls http://localhost:5080 &
          for i in $(seq 1 60); do curl -sf http://localhost:5080/api/health && break; sleep 1; done
          REQ=$(cat /proc/sys/kernel/random/uuid)
          curl -sf -X POST http://localhost:5080/api/employees/1/clock-in -H 'Content-Type: application/json' -d "{\"requestId\":\"$REQ\"}" | tee in.json
          grep -q '"timeSource"' in.json
          curl -sf http://localhost:5080/api/employees/1/attendance | grep -q '"openShift":{'
      - name: Show failed tests as annotations
        if: failure()
        shell: python3 {0}
        run: |
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          clean = lambda s: (s or "").replace("%", "%25").replace("\r", "").replace("\n", "%0A")[:1500]
          for f in glob.glob("TestResults/**/*.trx", recursive=True):
              for r in ET.parse(f).getroot().iterfind(".//t:UnitTestResult", ns):
                  if r.get("outcome") != "Failed":
                      continue
                  msg = r.findtext(".//t:Message", "", ns)
                  stack = r.findtext(".//t:StackTrace", "", ns)
                  print(f"::error title={clean(r.get('testName'))}::{clean(msg + chr(10) + stack[:600])}")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  frontend:
    name: React typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
